# Rolling holds — surgical pins that override floating (one per line).
# Format: <dirname>=<commit>   (comfy-core for ComfyUI itself)
# roll.sh floats everything EXCEPT these. Add a hold when upstream breaks,
# remove it on the next roll to retry. See docs/rolling-release.md.
#
# Example (commented out = no holds active):
# comfyui_controlnet_aux=e8b689a513c3e6b63edc44066560ca5919c0576e
